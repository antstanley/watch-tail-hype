<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>watch-tail · manga hype</title>
<link rel="stylesheet" href="node_modules/@fontsource/bangers/400.css" />
<link rel="stylesheet" href="node_modules/@fontsource/dela-gothic-one/400.css" />
<link rel="stylesheet" href="node_modules/@fontsource/comic-neue/700.css" />
<style>
	html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
	canvas { display: block; }
	#geo { position: absolute; width: 0; height: 0; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
</head>
<body>
<svg id="geo"></svg>
<script>
// A 30-second manga-style hype reel for watch-tail, drawn with p5.js.
// Every frame is a pure function of time: renderAt(t). Ink lines "boil" (re-jitter)
// at 12 fps from p5's Perlin noise, which is what gives the hand-drawn feel.

const W = 1920, H = 1080, DUR = 30, TAU = Math.PI * 2;
const PAPER = '#f5f0e4', INK = '#15120f', RED = '#dc2c3b', GOLD = '#ecb667', SHADE = '#cf8d45', CREAM = '#fce7c0';
const WHITE = '#fffdf7', GREY = '#8c857a';

// Timeline, in seconds.
const TL = {
	B: 1.0, C: 2.0, TYPE0: 2.2, TYPE1: 2.9, ENTER: 3.05, BLOT: 3.2, LOGS: 3.45,
	FREEZE: 7.5, CHART: 8.9, PUP: 11.75, FEAT: 17.25, END: 24.7, TBC: 28.2,
};
const FT = [17.3, 19.1, 20.9, 22.7]; // feature panels
const CMD = 'npx watch-tail';

// ---------- maths ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, q) => a + (b - a) * q;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut3 = (q) => 1 - (1 - q) ** 3;
const eIn3 = (q) => q ** 3;
const eInOut3 = (q) => (q < 0.5 ? 4 * q ** 3 : 1 - (-2 * q + 2) ** 3 / 2);
const eOutExpo = (q) => (q >= 1 ? 1 : 1 - 2 ** (-10 * q));
const eOutBack = (q, s = 2.2) => 1 + (s + 1) * (q - 1) ** 3 + s * (q - 1) ** 2;
function mulberry32(a) {
	return () => {
		a |= 0; a = (a + 0x6d2b79f5) | 0;
		let t = Math.imul(a ^ (a >>> 15), 1 | a);
		t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
		return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
	};
}
const rng = (...k) => {
	let h = 1779033703;
	for (const v of k) { h = Math.imul(h ^ Math.round(v * 1000), 3432918353); h = (h << 13) | (h >>> 19); }
	return mulberry32(h);
};
const centroid = (p) => [p.reduce((a, q) => a + q[0], 0) / p.length, p.reduce((a, q) => a + q[1], 0) / p.length];
const bbox = (p) => {
	const xs = p.map((q) => q[0]), ys = p.map((q) => q[1]);
	const x = Math.min(...xs), y = Math.min(...ys);
	return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
};

let P, ctx, T = 0, BOIL = 0;
const N = (x, y = 0, z = 0) => P.noise(x, y, z);
const F = (k, s) => ({
	bang: `${s}px "Bangers"`, dela: `${s}px "Dela Gothic One"`, comic: `bold ${s}px "Comic Neue"`,
	mono: `${s}px Menlo, monospace`, monob: `bold ${s}px Menlo, monospace`,
})[k];

// ---------- point lists ----------
function linePts(x1, y1, x2, y2, step = 14) {
	const n = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step)), o = [];
	for (let i = 0; i <= n; i++) o.push([lerp(x1, x2, i / n), lerp(y1, y2, i / n)]);
	return o;
}
function polyPts(c, step = 16) {
	const o = [];
	c.forEach((a, i) => { const b = c[(i + 1) % c.length], s = linePts(a[0], a[1], b[0], b[1], step); s.pop(); o.push(...s); });
	return o;
}
function ellPts(cx, cy, rx, ry, n = 48, a0 = 0, a1 = TAU, closed = true) {
	const o = [];
	for (let i = 0; i < (closed ? n : n + 1); i++) { const a = a0 + (a1 - a0) * (i / n); o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
	return o;
}
function rrectPts(x, y, w, h, r, step = 16) {
	const o = [];
	const arc = (cx, cy, a0) => { for (let i = 0; i <= 5; i++) { const a = a0 + (i / 5) * (Math.PI / 2); o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
	arc(x + w - r, y + r, -Math.PI / 2); arc(x + w - r, y + h - r, 0); arc(x + r, y + h - r, Math.PI / 2); arc(x + r, y + r, Math.PI);
	return polyPts(o, step);
}
const rectPts = (x, y, w, h, step = 18) => polyPts([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], step);

// ---------- ink ----------
function trace(pts, close) {
	ctx.moveTo(pts[0][0], pts[0][1]);
	for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
	if (close) ctx.closePath();
}

// Wobble a point list with low-frequency noise that changes on every boil tick.
// Closed shapes walk the noise field around a circle so the seam doesn't kink.
function jit(pts, amt, seed, closed = false, freq = 0.012) {
	if (!amt) return pts;
	const z = BOIL * 0.43 + seed * 1.7;
	let total = 0;
	const s = pts.map((p, i) => (i ? (total += Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1])) : 0));
	if (closed) total += Math.hypot(pts[0][0] - pts.at(-1)[0], pts[0][1] - pts.at(-1)[1]);
	const R = (total * freq) / TAU;
	return pts.map((p, i) => {
		let u, v;
		if (closed) { const a = (s[i] / total) * TAU; u = Math.cos(a) * R + seed * 3.1; v = Math.sin(a) * R; }
		else { u = s[i] * freq + seed * 3.1; v = 0; }
		return [p[0] + (N(u, v + z) - 0.5) * 2.2 * amt, p[1] + (N(u + 71.3, v + z + 19.7) - 0.5) * 2.2 * amt];
	});
}

// A brush stroke along a point list: a filled ribbon whose width breathes with noise
// and, for open strokes, tapers at both ends.
function ribbon(pts, w, seed, closed = false, taper = !closed, vary = 0.5) {
	const n = pts.length;
	if (n < 2) return;
	const L = [], R = [], z = BOIL * 0.31 + seed;
	let s = 0;
	for (let i = 0; i < n; i++) {
		const a = pts[closed ? (i - 1 + n) % n : Math.max(0, i - 1)], b = pts[closed ? (i + 1) % n : Math.min(n - 1, i + 1)];
		let tx = b[0] - a[0], ty = b[1] - a[1];
		const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
		if (i) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
		let hw = (w / 2) * (1 - vary + 2 * vary * N(s * 0.015 + seed * 5.3, z));
		if (taper) hw *= clamp(Math.sin((Math.PI * i) / (n - 1)) * 1.8, 0.12, 1);
		L.push([pts[i][0] - ty * hw, pts[i][1] + tx * hw]);
		R.push([pts[i][0] + ty * hw, pts[i][1] - tx * hw]);
	}
	ctx.beginPath();
	if (closed) { trace(L, true); trace(R.reverse(), true); }
	else { trace(L, false); for (let i = n - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]); ctx.closePath(); }
	ctx.fill();
}

// Screentone: dot patterns kept at screen scale whatever the current transform.
const TONE = {};
function makeTone(cell, r, color) {
	const c = document.createElement('canvas');
	c.width = c.height = cell;
	const g = c.getContext('2d');
	g.fillStyle = color; g.beginPath();
	for (const [x, y] of [[cell / 2, cell / 2], [0, 0], [cell, 0], [0, cell], [cell, cell]]) { g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU); }
	g.fill();
	return ctx.createPattern(c, 'repeat');
}
function setTone(pat) { pat.setTransform(ctx.getTransform().invertSelf()); ctx.fillStyle = pat; }

function shape(pts, o = {}) {
	const { fill = null, tone = null, w = 6, seed = 1, j = 2, closed = true, ink = INK, vary = 0.5 } = o;
	const q = jit(pts, j, seed, closed);
	if (fill || tone) {
		ctx.beginPath(); trace(q, true);
		if (fill) { ctx.fillStyle = fill; ctx.fill(); }
		if (tone) { setTone(tone); ctx.fill(); }
	}
	if (w > 0) { ctx.fillStyle = ink; ribbon(q, w, seed, closed, o.taper ?? !closed, vary); }
	return q;
}
function inkPath(pts, w, seed, j = 1.5, col = INK, closed = false) { ctx.fillStyle = col; ribbon(jit(pts, j, seed, closed), w, seed, closed, !closed); }
function inkLine(x1, y1, x2, y2, w = 4, seed = 1, j = 1.5, col = INK) { inkPath(linePts(x1, y1, x2, y2, 12), w, seed, j, col); }

// 集中線: focus lines converging on a point, re-drawn every boil tick.
function focus(cx, cy, r0, o = {}) {
	const { n = 150, seed = 1, col = INK, wmax = 12, ex = 1, ey = 1, spread = 0.6, rmax = 2600, fast = false } = o;
	const r = rng(seed, fast ? Math.floor(Math.min(T, TL.TBC) * 24) : BOIL);
	ctx.fillStyle = col; ctx.beginPath();
	for (let i = 0; i < n; i++) {
		const a = ((i + r()) / n) * TAU, ca = Math.cos(a), sa = Math.sin(a);
		const ri = r0 * (1 + r() * spread), w = wmax * (0.25 + r() * 0.9);
		const bx = cx + ca * rmax, by = cy + sa * rmax;
		ctx.moveTo(cx + ca * ri * ex, cy + sa * ri * ey);
		ctx.lineTo(bx - sa * w, by + ca * w); ctx.lineTo(bx + sa * w, by - ca * w); ctx.closePath();
	}
	ctx.fill();
}

// Parallel speed lines drifting along `angle`.
function speed(angle, o = {}) {
	const { n = 60, seed = 1, col = INK, t = T, v = 2500, len = [300, 1000], w = [1.5, 6], cx = W / 2, cy = H / 2, span = 2400 } = o;
	const r = rng(seed), dx = Math.cos(angle), dy = Math.sin(angle), nx = -dy, ny = dx, cyc = 3600;
	ctx.fillStyle = col; ctx.beginPath();
	for (let i = 0; i < n; i++) {
		const lat = (r() - 0.5) * span, L = lerp(len[0], len[1], r()), ww = lerp(w[0], w[1], r()) / 2;
		const pos = ((r() * cyc + t * v * (0.7 + 0.6 * r())) % cyc) - cyc / 2;
		const hx = cx + dx * pos + nx * lat, hy = cy + dy * pos + ny * lat, tx = hx - dx * L, ty = hy - dy * L;
		const mx = (hx + tx) / 2, my = (hy + ty) / 2;
		ctx.moveTo(hx, hy); ctx.lineTo(mx + nx * ww, my + ny * ww); ctx.lineTo(tx, ty); ctx.lineTo(mx - nx * ww, my - ny * ww); ctx.closePath();
	}
	ctx.fill();
}

function blotPath(cx, cy, R, seed) {
	const pts = [];
	for (let i = 0; i < 100; i++) {
		const a = (i / 100) * TAU, k = 1 + 0.4 * (N(Math.cos(a) * 1.4 + seed, Math.sin(a) * 1.4 + seed, BOIL * 0.15) - 0.5);
		pts.push([cx + Math.cos(a) * R * k, cy + Math.sin(a) * R * k]);
	}
	return pts;
}
function blot(cx, cy, R, seed) {
	if (R <= 0) return;
	ctx.fillStyle = INK; ctx.beginPath(); trace(blotPath(cx, cy, R, seed), true); ctx.fill();
	const r = rng(seed);
	ctx.beginPath();
	for (let k = 0; k < 22; k++) {
		const a = r() * TAU, d = R * (1.08 + r() * 0.45), s = R * (0.012 + r() * 0.045);
		ctx.moveTo(cx + Math.cos(a) * d + s, cy + Math.sin(a) * d); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, s, 0, TAU);
	}
	ctx.fill();
}
function iris(cx, cy, R, seed) {
	ctx.fillStyle = INK; ctx.beginPath();
	ctx.rect(-200, -200, W + 400, H + 400);
	trace(blotPath(cx, cy, Math.max(0, R), seed), true);
	ctx.fill('evenodd');
}

// ---------- lettering ----------
// strokes: [[colour, width], ...] drawn outermost first; shadow repeats the outermost stroke.
function say(str, x, y, o = {}) {
	const { font = 'bang', size = 100, fill = INK, strokes = [], align = 'center', jit = 0, rotJit = 0, seed = 1, spacing = 0, shadow = null, fast = false } = o;
	ctx.font = F(font, size); ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.miterLimit = 2;
	const draw = (s, px, py) => {
		if (shadow) {
			ctx.fillStyle = ctx.strokeStyle = shadow.color;
			if (strokes.length) { ctx.lineWidth = strokes[0][1]; ctx.strokeText(s, px + shadow.dx, py + shadow.dy); }
			ctx.fillText(s, px + shadow.dx, py + shadow.dy);
		}
		for (const [c, w] of strokes) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.strokeText(s, px, py); }
		if (fill) { ctx.fillStyle = fill; ctx.fillText(s, px, py); }
	};
	if (!jit && !rotJit && !spacing) { ctx.textAlign = align; draw(str, x, y); return ctx.measureText(str).width; }
	ctx.textAlign = 'center';
	const ch = [...str], ws = ch.map((c) => ctx.measureText(c).width);
	const total = ws.reduce((a, b) => a + b, 0) + spacing * (ch.length - 1);
	let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
	const tick = fast ? Math.floor(Math.min(T, TL.TBC) * 24) : BOIL;
	ch.forEach((c, i) => {
		const r = rng(seed, i, tick);
		ctx.save();
		ctx.translate(cx + ws[i] / 2 + (r() - 0.5) * 2 * jit, y + (r() - 0.5) * 2 * jit);
		ctx.rotate((r() - 0.5) * 2 * rotJit);
		draw(c, 0, 0);
		ctx.restore();
		cx += ws[i] + spacing;
	});
	return total;
}

function anim(kind, dt) {
	const a = { dx: 0, dy: 0, s: 1, o: 1, rot: 0, skew: 0 };
	switch (kind) {
		case 'slam': a.s = lerp(2.6, 1, eOutBack(clamp(dt / 0.26), 1.8)); a.o = clamp(dt / 0.05); break;
		case 'pop': { const k = clamp(dt / 0.3); a.s = eOutBack(k, 3); a.dy = (1 - eOut3(k)) * 60; a.rot = (1 - k) * -0.25; break; }
		case 'slideL': case 'slideR': {
			const d = kind === 'slideL' ? -1 : 1, e = eOutExpo(clamp(dt / 0.32));
			a.dx = d * (1 - e) * 1500; a.skew = d * (1 - e) * 0.4; a.o = clamp(dt / 0.05); break;
		}
		case 'rise': a.dy = (1 - eOut3(clamp(dt / 0.3))) * 40; a.o = clamp(dt / 0.2); break;
		case 'stamp': { const k = clamp(dt / 0.18); a.s = lerp(2.2, 1, eOutBack(k, 1.4)); a.o = clamp(dt / 0.04); a.rot = (1 - k) * 0.3; break; }
	}
	return a;
}
function word(str, t, t0, t1, x, y, o = {}, kind = 'slam', rot = 0) {
	if (t < t0 || t >= t1) return;
	const a = anim(kind, t - t0);
	ctx.save();
	ctx.globalAlpha *= a.o;
	ctx.translate(x + a.dx, y + a.dy); ctx.rotate(rot + a.rot);
	if (a.skew) ctx.transform(1, 0, -a.skew, 1, 0, 0);
	ctx.scale(a.s, a.s);
	say(str, 0, 0, o);
	ctx.restore();
}

function caption(lines, x, y, o = {}) {
	const { size = 34, seed = 1, fill = WHITE, fg = INK, pad = 16, lh = 1.2 } = o;
	ctx.font = F('comic', size);
	const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + pad * 2, h = lines.length * size * lh + pad * 1.2;
	shape(rectPts(x, y, w, h), { fill, w: 4, seed, j: 1.1 });
	lines.forEach((l, i) => say(l, x + pad, y + pad * 0.6 + size * lh * (i + 0.5), { font: 'comic', size, fill: fg, align: 'left' }));
	return { w, h };
}

function bubble(cx, cy, rx, ry, tx, ty, seed, o = {}) {
	const { fill = WHITE, w = 5, j = 2.5 } = o;
	const a = Math.atan2((ty - cy) / ry, (tx - cx) / rx), d = 0.2;
	const pts = ellPts(cx, cy, rx, ry, 72, a + d, a + TAU - d, false);
	pts.push([tx, ty]);
	shape(pts, { fill, w, seed, j, closed: true });
}
function burst(cx, cy, rx, ry, spikes, seed, o = {}) {
	const r = rng(seed, BOIL), c = [];
	for (let i = 0; i < spikes * 2; i++) {
		const a = (i / (spikes * 2)) * TAU + (r() - 0.5) * 0.12, k = i % 2 ? 0.8 + r() * 0.05 : 1 + r() * 0.22;
		c.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
	}
	shape(polyPts(c, 22), { fill: o.fill ?? WHITE, w: o.w ?? 7, seed, j: 1.5 });
}
function sparkle(x, y, r, seed, col = WHITE) {
	const c = [];
	for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU - Math.PI / 2, k = i % 2 ? 0.2 : 1; c.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k]); }
	shape(polyPts(c, 8), { fill: col, w: Math.max(2, r * 0.12), seed, j: 0.6 });
}
function heart(x, y, r, seed) {
	const c = [];
	for (let i = 0; i < 40; i++) {
		const a = (i / 40) * TAU;
		c.push([x + (16 * Math.sin(a) ** 3 * r) / 16, y - ((13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * r) / 16]);
	}
	shape(c, { fill: RED, w: Math.max(2.5, r * 0.14), seed, j: 1 });
}

// ---------- log lines ----------
const GROUPS = ['/aws/lambda/checkout-api', '/aws/lambda/payments    ', '/aws/ecs/orders-svc     '];
const MSGS = {
	info: [['cart validated', 'items', 290], ['order created', 'total', 4210], ['session refreshed', 'ttl', 3600], ['cache hit', 'keys', 12]],
	debug: [['db query', 'rows', 18], ['feature flag', 'variant', 2], ['retry budget', 'left', 3]],
	warn: [['payment retry', 'attempt', 2], ['slow upstream', 'ms', 912]],
	error: [['checkout failed', 'code', 502], ['card declined', 'code', 402]],
};
const hex = (r, n) => { let s = ''; for (let i = 0; i < n; i++) s += '0123456789abcdef'[Math.floor(r() * 16)]; return s; };
const LINE_H = 38, ROWS = 31, ROW_Y0 = 20;
function logOffset(t) { const d = clamp(t, TL.LOGS, TL.FREEZE) - TL.LOGS; return 40 + 30 * d + 22 * d * d; }
const ERROR_INDEX = Math.floor(logOffset(TL.FREEZE)) + 15;
const LOGS = new Map();
function logData(i) {
	if (LOGS.has(i)) return LOGS.get(i);
	const r = mulberry32(i * 2654435761);
	const roll = r();
	let lv = roll < 0.5 ? 'info' : roll < 0.72 ? 'debug' : roll < 0.9 ? 'warn' : 'error';
	const ms = 28628 + i * 137;
	const ts = `14:${String(17 + (Math.floor(ms / 60000) % 40)).padStart(2, '0')}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}.${String(ms % 1000).padStart(3, '0')}`;
	const grp = GROUPS[Math.floor(r() * GROUPS.length)];
	let [msg, key, base] = MSGS[lv][Math.floor(r() * MSGS[lv].length)];
	let num = Math.floor(base * (0.5 + r())), rid = hex(r, 12);
	const dur = Math.floor(4 + r() * 40);
	if (i === ERROR_INDEX) { lv = 'error'; [msg, key, num, rid] = ['checkout failed', 'code', 502, '19d9db504bc4']; }
	const d = { ts, grp, lv, msg, json: `{"requestId":"${rid}","msg":"${msg}","${key}":${num},"durationMs":${dur}}` };
	LOGS.set(i, d);
	return d;
}
const LV_STYLE = { error: { box: RED, fg: WHITE }, warn: { box: INK, fg: WHITE }, info: { line: INK, fg: INK }, debug: { line: GREY, fg: GREY } };
function levelTag(lv, x, y, size, cw) {
	const st = LV_STYLE[lv], lw = cw * 6.4, lh = size * 1.25;
	if (st.box) { ctx.fillStyle = st.box; ctx.fillRect(x - cw * 0.7, y - lh / 2, lw, lh); }
	if (st.line) { ctx.strokeStyle = st.line; ctx.lineWidth = Math.max(1.5, size / 12); ctx.strokeRect(x - cw * 0.7, y - lh / 2, lw, lh); }
	ctx.font = F('monob', size); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = st.fg; ctx.fillText(lv.toUpperCase(), x, y);
}
function drawRow(d, x, y, size = 25) {
	ctx.font = F('mono', size); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
	const cw = ctx.measureText('0').width;
	ctx.fillStyle = GREY; ctx.fillText(d.ts, x, y);
	ctx.fillStyle = INK; ctx.fillText(d.grp, x + cw * 14, y);
	levelTag(d.lv, x + cw * 40, y, size, cw);
	ctx.font = F('mono', size); ctx.fillStyle = INK; ctx.fillText(d.json, x + cw * 47, y);
}
function drawLogs(off, v, o = {}) {
	const base = Math.floor(off), frac = off - base;
	const g = v > 30 ? Math.min(70, v * 0.3) : 0;
	for (const [gy, a] of g ? [[g, 0.1], [g / 2, 0.2], [0, 1]] : [[0, 1]]) {
		ctx.globalAlpha = a;
		for (let r = 0; r < ROWS; r++) {

function sampleD(d, step = 5) {
	const svg = document.getElementById('geo');
	return d.match(/M[^M]*/g).map((sd) => {
		const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
		el.setAttribute('d', sd); svg.appendChild(el);

		for (let i = 0; i <= n; i++) { const q = el.getPointAtLength((L * i) / n); pts.push([q.x, q.y]); }

	});
}

		word(f.title, dt, 0.03, 99, b.x + 50, b.y + 100, { size: 104, align: 'left', fill: INK, strokes: [[WHITE, 22]], shadow: { dx: 6, dy: 7, color: RED } }, 'slam');
		if (dt > 0.18) {
			const q = eOut3(prog(dt, 0.18, 0.4));
			ctx.save(); ctx.globalAlpha *= q; ctx.translate(0, (1 - q) * 30);
			caption(f.cap, b.x + 54, b.y + 150, { size: 30, seed: 650 + i });
			ctx.restore();
		}
	}));
	const st = pup5(t);
	if (st) drawPuppy(st, t);
}

// ================= ACT 6 · end card =================
const S6 = { x: 470, y: 640, w: 700 };
const LOGO = { x0: 860, y: 420, xs: [], size: 160 };
function layoutLogo() {
	ctx.font = F('dela', 160);
	const ws = [...'watch-tail'].map((c) => ctx.measureText(c).width), total = ws.reduce((a, b) => a + b, 0);
	const s = Math.min(1, 980 / total);
	LOGO.size = 160 * s;
	let x = LOGO.x0;
	LOGO.xs = ws.map((w) => { const c = x + (w * s) / 2; x += w * s; return c; });
	LOGO.end = x;
}
function pup6(tf) {
	const land = 25.15;
	const st = { x: S6.x, y: S6.y, w: S6.w, rot: 0, sx: 1, sy: 1, amp: 28, period: 0.25, tilt: 0, blush: true, marks: true, shadow: true };
	if (tf < land) {
		const q = prog(tf, 24.8, land);
		Object.assign(st, hop({ x: 1500, y: -400, w: S6.w }, S6, q, 200), { rot: -Math.sin(Math.PI * q) * 0.4, marks: false, shadow: false });
		return st;
	}
	const dt = tf - land, sq = Math.exp(-6 * dt) * Math.cos(dt * 24), beat = Math.max(0, Math.sin((dt / 0.5) * Math.PI)) ** 6;
	Object.assign(st, { sx: 1 + 0.18 * sq, sy: 1 - 0.2 * sq, tilt: 0.14 * Math.sin(dt * 3) });
	st.y -= beat * 18;
	return st;
}
function hanko(x, y, s, rot, seed) {
	ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
	shape(rrectPts(-75, -75, 150, 150, 20), { fill: RED, w: 0, seed, j: 2 });
	inkPath(rrectPts(-62, -62, 124, 124, 12), 5, seed + 1, 1.2, PAPER, true);
	say('尾', 0, 4, { font: 'dela', size: 100, fill: PAPER });
	const r = rng(seed);
	ctx.fillStyle = PAPER;
	for (let i = 0; i < 40; i++) { ctx.beginPath(); ctx.arc((r() - 0.5) * 140, (r() - 0.5) * 140, 0.8 + r() * 2.2, 0, TAU); ctx.fill(); }
	ctx.restore();
}
function act6(t) {
	const tf = Math.min(t, TL.TBC);
	paper(); ctx.drawImage(RT6, 0, 0);
	focus(960, 540, 470, { ex: 1.6, ey: 0.95, n: 140, seed: 61, wmax: 12 });
	sparkles(tf, 170, 14, { x: 60, y: 60, w: 780, h: 700 });
	const st = pup6(tf);
	drawPuppy(st, tf);
	word('ワン!', tf, 25.3, 99, 250, 250, { font: 'dela', size: 110, fill: GOLD, strokes: [[WHITE, 32], [INK, 14]], jit: 3, rotJit: 0.06, seed: 180, fast: true }, 'pop', -0.15);
	const letter = { font: 'dela', size: LOGO.size };
	[...'watch-tail'].forEach((c, i) => {
		const tail = i >= 6;
		word(c, tf, 25.3 + i * 0.05, 99, LOGO.xs[i], LOGO.y, {
			...letter, fill: tail ? GOLD : INK,
			strokes: tail ? [[INK, 40], [WHITE, 26], [INK, 10]] : [[INK, 40], [WHITE, 24]],
			shadow: { dx: 10, dy: 12, color: tail ? RED : INK },
		}, 'stamp');
	});
	word('Tail logs. Wag tails.', tf, 25.9, 99, LOGO.x0 + 10, 600, { size: 96, align: 'left', fill: INK, strokes: [[WHITE, 22]] }, 'rise');
	if (tf >= 26.3) {
		const a = anim('pop', tf - 26.3);
		ctx.save(); ctx.translate(LOGO.x0 + 10, 730 + a.dy); ctx.scale(a.s, a.s);
		ctx.font = F('monob', 50);
		const cw = ctx.measureText('0').width, bw = cw * 17.4 + 56;
		shape(rectPts(12, -40, bw, 92), { fill: INK, w: 0, seed: 190, j: 1 });
		shape(rectPts(0, -52, bw, 92), { fill: WHITE, w: 6, seed: 191 });
		say('$', 28, -4, { font: 'monob', size: 50, fill: RED, align: 'left' });
		say(CMD, 28 + cw * 2, -4, { font: 'monob', size: 50, align: 'left' });
		if (Math.floor(tf * 3) % 2 === 0) { ctx.fillStyle = INK; ctx.fillRect(28 + cw * 16.4, -30, cw * 0.62, 54); }
		ctx.restore();
	}
	if (tf >= 26.8) {
		const k = clamp((tf - 26.8) / 0.14);
		ctx.save(); ctx.globalAlpha = clamp((tf - 26.8) / 0.03);
		hanko(1780, 640, lerp(1.8, 1, eOutBack(k, 1.2)), 0.14, 200);
		ctx.restore();
	}
}
function tbc(t) {
	const q = eOutBack(prog(t, TL.TBC + 0.05, TL.TBC + 0.4), 1.3);
	if (q <= 0) return;
	const w = 640, x = lerp(W + 40, W - 60 - w, q), y = 990;
	const poly = [[x, y], [x + 70, y - 58], [x + 70, y - 36], [x + w, y - 36], [x + w, y + 36], [x + 70, y + 36], [x + 70, y + 58]];
	shape(polyPts(poly, 20), { fill: '#efdcb4', w: 6, seed: 701, j: 1 });
	say('TO BE CONTINUED', x + 70 + (w - 70) / 2, y + 3, { size: 52, spacing: 3 });
}

// ---------- transitions ----------
function wipeBand(t, t0, t1, o) {
	const q = eInOut3(prog(t, t0, t1));
	if (q <= 0 || q >= 1) return;
	const cx = lerp(-1700, W + 1700, q), hw = 1300, sk = 300;
	const poly = [[cx - hw + sk, -60], [cx + hw + sk, -60], [cx + hw - sk, H + 60], [cx - hw - sk, H + 60]];
	ctx.beginPath(); trace(poly, true); ctx.fillStyle = o.fill; ctx.fill();
	if (o.tone) { setTone(o.tone); ctx.fill(); }
	if (o.lines) { ctx.save(); ctx.beginPath(); trace(poly, true); ctx.clip(); speed(0, { n: 90, seed: 71, col: o.lines, t, v: 7000, w: [2, 8] }); ctx.restore(); }
	inkPath(linePts(...poly[0], ...poly[3], 20), 16, 72, 3);
	inkPath(linePts(...poly[1], ...poly[2], 20), 16, 73, 3);
	if (o.sparkle) for (let k = 0; k < 8; k++) {
		const u = (k + 0.5) / 8;
		sparkle(lerp(poly[1][0], poly[2][0], u) + 40, lerp(poly[1][1], poly[2][1], u), 26 + (k % 3) * 12, 74 + k);
	}
}

// ---------- the frame ----------
function renderAt(t) {
	T = t;
	BOIL = Math.floor(Math.min(t, TL.TBC) * 12);
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
	ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
	ctx.save();
	applyCamera(t);
	if (t < TL.LOGS) act1(t);
	else if (t < TL.FREEZE) act2(t);
	else if (t < TL.CHART) act3a(t);
	else if (t < TL.PUP) act3b(t);
	else if (t < TL.FEAT) act4(t);
	else if (t < TL.END) act5(t);
	else act6(t);
	ctx.restore();
	wipeBand(t, 11.5, 12.0, { fill: GOLD, tone: TONE.gold, sparkle: true });
	wipeBand(t, 17.05, 17.45, { fill: PAPER, lines: INK });
	if (t >= 24.45 && t < TL.END) blot(960, 540, eIn3(prog(t, 24.45, TL.END)) * 2400, 81);
	if (t >= TL.END && t < 25.1) iris(S6.x, S6.y - 80, eOut3(prog(t, TL.END, 25.1)) * 2400, 82);
	ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(TEX, 0, 0); ctx.globalCompositeOperation = 'source-over';
	if (t >= TL.TBC) {
		const a = prog(t, TL.TBC, TL.TBC + 0.25);
		ctx.globalAlpha = a * 0.85; ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, W, H);
		ctx.globalAlpha = a; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = '#e6c692'; ctx.fillRect(0, 0, W, H);
		ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
		tbc(t);
	}
	let fl = 0;
	for (const [ti, a] of FLASHES) { const dt = t - ti; if (dt >= 0) fl += a * Math.exp(-11 * dt); }
	if (fl > 0.01) { ctx.globalAlpha = clamp(fl); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

// Paper grain, multiplied over the finished frame so the ink looks printed.
let TEX;
function makeTexture() {
	const c = document.createElement('canvas'); c.width = W; c.height = H;
	const g = c.getContext('2d'), r = mulberry32(5);
	g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
	for (let i = 0; i < 14000; i++) { g.fillStyle = `rgba(110,90,60,${0.03 + r() * 0.07})`; g.fillRect(r() * W, r() * H, 1 + r() * 1.6, 1 + r() * 1.6); }
	g.lineWidth = 1;
	for (let i = 0; i < 400; i++) {
		const x = r() * W, y = r() * H, a = r() * TAU, l = 6 + r() * 18;
		g.strokeStyle = `rgba(120,100,70,${0.05 + r() * 0.06})`;
		g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l, y + Math.sin(a + 0.6) * l, x + Math.cos(a) * l * 2, y + Math.sin(a) * l * 2); g.stroke();
	}
	const v = g.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.15);
	v.addColorStop(0, 'rgba(255,255,255,0)'); v.addColorStop(1, 'rgba(150,120,80,0.22)');
	g.fillStyle = v; g.fillRect(0, 0, W, H);
	return c;
}

let READY;
window.ready = new Promise((r) => (READY = r));
window.DUR = DUR;
new p5((p) => {
	P = p;
	p.setup = async () => {
		p.createCanvas(W, H);
		p.pixelDensity(1);
		p.noLoop();
		p.noiseSeed(7);
		p.noiseDetail(3, 0.5);
		ctx = p.drawingContext;
		await Promise.all([
			document.fonts.load('100px "Bangers"', 'ABC!'),
			document.fonts.load('100px "Dela Gothic One"', 'ゴドンカタフリザーッグルピコーンワ尾!watch-tail'),
			document.fonts.load('bold 40px "Comic Neue"', 'abc'),
		]);
		Object.assign(TONE, {
			light: makeTone(10, 1.5, INK), mid: makeTone(9, 2.4, INK), dark: makeTone(8, 3.1, INK),
			gold: makeTone(14, 4.2, SHADE),
		});
		TEX = makeTexture();
		RT4 = radialTone(1330, 580, 'rgba(207,141,69,0.55)', 300, 1250, 5.2);
		RT6 = radialTone(470, 620, 'rgba(207,141,69,0.5)', 280, 1500, 5);
		await loadPuppy();
		layoutLogo();
		window.renderAt = renderAt;
		renderAt(0);
		READY(true);
	};
	p.draw = () => {};
});

// Live preview when opened in a browser: ?t=12.3 holds a frame, otherwise it loops.
const qs = new URLSearchParams(location.search);
if (!navigator.webdriver) window.ready.then(() => {
	if (qs.has('t')) return renderAt(+qs.get('t'));
	const start = performance.now();
	const loop = () => { renderAt(((performance.now() - start) / 1000) % DUR); requestAnimationFrame(loop); };
	loop();
});
</script>
